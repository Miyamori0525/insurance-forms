<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14243a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="表格查詢">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<title>保險表格查詢</title>
<script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
  /* ===== 顏色（淺色／深色模式） ===== */
  :root {
    --bg:#f4f1ea; --paper:#fffdf9; --ink:#17212e; --ink-2:#465163; --muted:#7c8392;
    --line:#e7e1d4; --line-2:#d8cfbc; --hd:#14243a; --hd-2:#1d3352;
    --pri:#1a2f4b; --pri-ink:#fff; --gold:#b48a4a; --gold-2:#d9bd86; --gold-soft:#f5ecdb;
    --new:#c2410c; --warn:#9a5a06; --warn-bg:#fcf3e3; --warn-line:#efd6a8; --star:#d39b1c;
    --shadow:0 1px 2px rgba(20,36,58,.05), 0 6px 18px rgba(20,36,58,.06);
    --shadow-up:0 2px 4px rgba(20,36,58,.06), 0 12px 28px rgba(20,36,58,.10);
    --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
    color-scheme:light;
  }
  /* 深色：跟著手機設定，或使用者按右上角開關 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0e141c; --paper:#161f2a; --ink:#ebe6db; --ink-2:#bdb9b0; --muted:#8b919b;
      --line:#243040; --line-2:#334356; --hd:#0a111b; --hd-2:#14223a;
      --pri:#d9bd86; --pri-ink:#1a1408; --gold:#d9bd86; --gold-2:#e8d2a6; --gold-soft:#2a2418;
      --new:#f08a4b; --warn:#f0bf6a; --warn-bg:#2a2010; --warn-line:#4d3a17; --star:#f2c14e;
      --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-up:0 8px 24px rgba(0,0,0,.4);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"] {
      --bg:#0e141c; --paper:#161f2a; --ink:#ebe6db; --ink-2:#bdb9b0; --muted:#8b919b;
      --line:#243040; --line-2:#334356; --hd:#0a111b; --hd-2:#14223a;
      --pri:#d9bd86; --pri-ink:#1a1408; --gold:#d9bd86; --gold-2:#e8d2a6; --gold-soft:#2a2418;
      --new:#f08a4b; --warn:#f0bf6a; --warn-bg:#2a2010; --warn-line:#4d3a17; --star:#f2c14e;
      --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-up:0 8px 24px rgba(0,0,0,.4);
      color-scheme:dark;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
         background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  svg.i { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; }
  button { font:inherit; }
  :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }

  /* ===== 頂部 ===== */
  header { position:sticky; top:0; z-index:5; color:#fff;
           background:radial-gradient(120% 140% at 100% 0%, rgba(217,189,134,.16), transparent 55%), linear-gradient(180deg, var(--hd-2), var(--hd));
           padding:calc(env(safe-area-inset-top) + 14px) 16px 12px; box-shadow:0 1px 0 rgba(255,255,255,.04), 0 6px 20px rgba(10,17,27,.18); }
  .hd-in { position:relative; }
  .theme { position:absolute; right:0; top:1px; width:38px; height:38px; border-radius:50%; display:grid; place-items:center; cursor:pointer;
           border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.08); color:var(--gold-2); transition:background .15s; }
  .theme:hover { background:rgba(255,255,255,.16); }
  .theme svg.i { width:19px; height:19px; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .logo { width:34px; height:34px; color:var(--gold-2); flex:0 0 auto; }
  h1 { margin:0; font-family:var(--serif); font-weight:700; font-size:20px; letter-spacing:1.5px; line-height:1.15; }
  .tagline { font-size:11.5px; letter-spacing:1px; color:rgba(255,255,255,.6); margin-top:2px; }
  .tagline .dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:#5fbf86; margin:0 5px 1px 0; vertical-align:middle; }
  .tagline .dot.old { background:#e0a04a; }
  .checked { text-align:center; color:var(--muted); font-size:12.5px; line-height:1.7; margin:28px 8px 8px; padding-top:16px; border-top:1px solid var(--line); }
  .checked b { color:var(--ink); font-weight:600; }
  .checked .old { color:#b5651d; }
  .search { position:relative; display:block; }
  .search svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:#8a93a3; width:18px; height:18px; }
  #q { width:100%; font-size:16px; padding:12px 14px 12px 40px; border:1px solid transparent; border-radius:12px; outline:none;
       background:#fff; color:#17212e; box-shadow:inset 0 1px 2px rgba(0,0,0,.06); transition:border-color .15s, box-shadow .15s; }
  #q:focus { border-color:var(--gold-2); box-shadow:0 0 0 3px rgba(217,189,134,.35); }
  #q::placeholder { color:#9aa1ad; }
  .tabs { display:flex; gap:4px; margin-top:10px; padding:4px; background:rgba(255,255,255,.08); border-radius:12px; }
  .tab { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; border:0; border-radius:9px; padding:8px 0;
         font-size:14.5px; background:transparent; color:rgba(255,255,255,.78); cursor:pointer; transition:background .15s, color .15s; }
  .tab svg.i { width:17px; height:17px; }
  .tab.on { background:#fff; color:#14243a; font-weight:700; box-shadow:0 1px 3px rgba(0,0,0,.15); }
  .tab:not(.on):hover { color:#fff; background:rgba(255,255,255,.06); }

  /* ===== 公司篩選列（全部表格） ===== */
  .bar { display:flex; gap:8px; overflow-x:auto; padding:10px 16px; background:color-mix(in srgb, var(--bg) 92%, transparent);
         -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
         position:sticky; top:var(--hh,108px); z-index:4; scrollbar-width:none; }
  .bar::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; border:1px solid var(--line-2); background:var(--paper); color:var(--ink-2); border-radius:999px;
          padding:6px 13px; font-size:13.5px; cursor:pointer; transition:all .15s; }
  .chip:hover { border-color:var(--gold); color:var(--ink); }
  .chip.on { background:var(--pri); border-color:var(--pri); color:var(--pri-ink); }
  .chip.recent { color:var(--new); border-color:color-mix(in srgb, var(--new) 35%, var(--line-2)); }
  .chip.recent.on { background:var(--new); border-color:var(--new); color:#fff; }

  /* ===== 主要區塊 ===== */
  main { max-width:760px; margin:0 auto; padding:6px 14px 48px; }
  .meta { color:var(--muted); font-size:12.5px; margin:12px 4px 4px; letter-spacing:.3px; }
  .warn { display:flex; gap:8px; align-items:flex-start; background:var(--warn-bg); border:1px solid var(--warn-line); color:var(--warn);
          border-radius:12px; padding:11px 13px; font-size:14px; line-height:1.5; margin-top:12px; }
  .step { display:flex; align-items:center; gap:9px; font-family:var(--serif); font-size:16px; font-weight:700; color:var(--ink);
          margin:20px 2px 10px; letter-spacing:.5px; scroll-margin-top:calc(var(--hh,150px) + 10px); }
  .num { width:24px; height:24px; border-radius:50%; display:inline-grid; place-items:center; flex:0 0 auto;
         font-family:-apple-system,BlinkMacSystemFont,sans-serif; font-size:12.5px; font-weight:700;
         color:var(--gold); border:1.5px solid var(--gold); background:var(--gold-soft); }
  .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; }
  .pick { display:flex; align-items:center; gap:10px; text-align:left; border:1px solid var(--line); background:var(--paper); color:var(--ink);
          border-radius:14px; padding:11px 12px; font-size:15px; cursor:pointer; box-shadow:var(--shadow); min-width:0;
          transition:transform .12s, border-color .15s, box-shadow .15s, background .15s; }
  .pick:hover { border-color:var(--line-2); box-shadow:var(--shadow-up); }
  .pick:active { transform:scale(.98); }
  .pick.on { background:var(--pri); border-color:var(--pri); color:var(--pri-ink); box-shadow:0 0 0 3px color-mix(in srgb, var(--gold) 35%, transparent), var(--shadow-up); }
  .mono { width:36px; height:36px; border-radius:11px; display:grid; place-items:center; flex:0 0 auto; font-family:var(--serif); font-weight:700;
          font-size:17px; color:hsl(var(--h) 38% 32%); background:hsl(var(--h) 45% 92%); }
  .pick.on .mono { background:rgba(255,255,255,.14); color:#fff; }
  .mono { position:relative; overflow:hidden; box-shadow:0 0 0 1px var(--line); }
  .mono img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#fff; }
  .pick.on .mono { box-shadow:0 0 0 2px rgba(255,255,255,.55); }
  .nm { min-width:0; display:flex; flex-direction:column; line-height:1.25; }
  .nm b { font-weight:700; font-size:15px; }
  .nm small { font-size:11.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pick.on small { color:color-mix(in srgb, var(--pri-ink) 70%, transparent); }
  .ico { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; flex:0 0 auto; background:var(--gold-soft); color:var(--gold); }
  .pick.on .ico { background:rgba(255,255,255,.14); color:var(--gold-2); }
  .pick.svc { font-size:14.5px; font-weight:600; padding:10px 11px; }

  /* ===== 表格卡片 ===== */
  .group { display:flex; align-items:baseline; gap:8px; margin:24px 4px 8px; font-size:13px; color:var(--muted); }
  .group b { font-family:var(--serif); font-size:15px; color:var(--ink); letter-spacing:.5px; }
  .group::after { content:""; flex:1; height:1px; background:var(--line); align-self:center; }
  .card { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:13px 14px; margin-bottom:8px;
          display:flex; gap:12px; align-items:center; box-shadow:var(--shadow); transition:border-color .15s, box-shadow .15s; }
  .doc { display:none; }
  .card .txt { flex:1; min-width:0; }
  .title { font-size:15.5px; line-height:1.45; word-break:break-word; font-weight:500; }
  .sub { font-size:12px; color:var(--muted); margin-top:5px; display:flex; flex-wrap:wrap; align-items:center; gap:6px; overflow-wrap:anywhere; }
  .badge, .chk { display:inline-block; font-size:11px; font-weight:700; border-radius:6px; padding:1px 6px; margin-right:6px; vertical-align:2px; letter-spacing:.5px; }
  .badge { color:#fff; background:var(--new); }
  .chk { color:var(--warn); background:var(--warn-bg); border:1px solid var(--warn-line); }
  .co { display:inline-block; font-size:11px; color:var(--ink-2); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:0 6px; }
  .note { font-size:12.5px; color:var(--ink-2); margin-top:6px; line-height:1.5; padding-left:9px; border-left:2px solid var(--gold-2); }
  .btns { display:flex; flex-direction:column; gap:6px; flex:0 0 auto; width:108px; }
  .acts { display:flex; gap:6px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:5px; font-size:14px; text-decoration:none; border-radius:10px;
         padding:8px 10px; border:1px solid var(--line-2); color:var(--ink); background:var(--paper); cursor:pointer; white-space:nowrap;
         transition:filter .15s, border-color .15s, background .15s, transform .12s; }
  .btn:active { transform:scale(.97); }
  .btn svg.i { width:16px; height:16px; }
  .btn.primary { background:var(--pri); border-color:var(--pri); color:var(--pri-ink); font-weight:600; }
  .btn.primary:hover { filter:brightness(1.12); }
  .btn.gold { background:linear-gradient(180deg, #d3b47a, #b48a4a); border-color:#a97f40; color:#fff; font-weight:600; text-shadow:0 1px 0 rgba(0,0,0,.12); }
  .btn.gold:hover { filter:brightness(1.06); }
  .acts .btn { flex:1; padding:7px 4px; gap:3px; }
  .acts .fav { flex:0 0 36px; }
  .btn:not(.primary):not(.gold):hover { border-color:var(--gold); }
  .fav svg.i { width:17px; height:17px; }
  .fav.on { color:var(--star); border-color:color-mix(in srgb, var(--star) 45%, var(--line-2)); }
  .fav.on svg.i { fill:currentColor; }

  /* ===== 服務結果 ===== */
  .res-h { justify-content:space-between; flex-wrap:wrap; row-gap:10px; }
  .res-t { display:flex; align-items:center; gap:9px; min-width:0; }
  .res-h .btn { font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif; font-size:13.5px; padding:8px 13px; letter-spacing:0; }
  .none { display:flex; flex-direction:column; align-items:center; gap:10px; background:var(--paper); border:1px dashed var(--line-2);
          border-radius:14px; padding:26px 18px; color:var(--ink-2); font-size:14.5px; line-height:1.6; text-align:center; }
  .none svg.i { width:30px; height:30px; color:var(--gold); stroke-width:1.4; }
  .hint { display:flex; gap:7px; font-size:12.5px; color:var(--muted); margin:12px 4px 0; line-height:1.6; }
  .hint svg.i { width:15px; height:15px; margin-top:2px; }
  .fav-h .num { color:var(--star); border-color:var(--star); }
  .empty { text-align:center; color:var(--muted); padding:48px 0; }
  .ph { display:none; }
  @media (prefers-reduced-motion: no-preference) {
    .svc-right > .card, .svc-right > .none { animation:rise .28s ease both; }
    .svc-right > .card:nth-of-type(2) { animation-delay:.04s; } .svc-right > .card:nth-of-type(3) { animation-delay:.08s; }
    .svc-right > .card:nth-of-type(4) { animation-delay:.12s; } .svc-right > .card:nth-of-type(5) { animation-delay:.16s; }
  }
  @keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

  /* ===== 手機：往下滑收起標題 ===== */
  @media (max-width: 899px) { header.mini .brand, header.mini .theme { display:none; } }
  @media (max-width: 360px) { .btns { width:100px; } .pick { padding:10px; gap:8px; } .mono, .ico { width:30px; height:30px; } }

  /* ===== 電腦版（螢幕寬度 900px 以上） ===== */
  @media (min-width: 900px) {
    header { padding:16px max(28px, calc((100vw - 1160px) / 2)); }
    .hd-in { display:grid; grid-template-columns:auto 1fr 330px auto; gap:20px; align-items:center; }
    .theme { position:static; }
    .brand { margin:0; }
    .logo { width:38px; height:38px; }
    h1 { font-size:22px; }
    .tabs { margin-top:0; }
    .bar { padding:10px max(28px, calc((100vw - 1160px) / 2)); flex-wrap:wrap; }
    main { max-width:1160px; padding:12px 28px 64px; }
    .svc-wrap { display:grid; grid-template-columns:380px 1fr; gap:36px; align-items:start; }
    .svc-left { position:sticky; top:calc(var(--hh,80px) + 4px); padding-bottom:12px; }
    .ph { display:block; margin-top:58px; background:var(--paper); border:1px dashed var(--line-2); border-radius:18px; padding:46px 28px; text-align:center; color:var(--muted); }
    .ph-steps { display:flex; justify-content:center; align-items:center; gap:14px; margin-bottom:22px; }
    .ph-steps div { display:flex; flex-direction:column; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-2); width:96px; }
    .ph-steps .ico { width:52px; height:52px; border-radius:16px; }
    .ph-steps .ico svg.i { width:24px; height:24px; }
    .ph-arrow { color:var(--line-2); }
    .ph p { margin:0; font-size:15px; line-height:1.8; }
    #list { display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:stretch; }
    #list .group, #list .empty { grid-column:1 / -1; }
    #list > *, .svc-wrap > * { min-width:0; }
    #list .group { margin:22px 4px 2px; }
    #list .favs { grid-column:1 / -1; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    #list .favs .step { grid-column:1 / -1; margin:16px 2px 0; }
    .card { margin-bottom:0; padding:14px 16px; }
    .svc-right .card { margin-bottom:10px; }
    .card:hover { border-color:var(--line-2); box-shadow:var(--shadow-up); }
    .doc { display:grid; place-items:center; width:40px; height:48px; border-radius:8px; flex:0 0 auto; align-self:flex-start;
           background:var(--bg); border:1px solid var(--line); color:var(--gold); position:relative; }
    .doc::after { content:"PDF"; position:absolute; bottom:4px; font-size:8.5px; font-weight:800; letter-spacing:.5px; color:var(--muted); }
    .doc svg.i { width:18px; height:18px; margin-top:-8px; }
    .btns { width:118px; }
  }

  #toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 28px); transform:translate(-50%, 8px); background:rgba(20,36,58,.94);
           color:#fff; padding:10px 18px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none;
           box-shadow:0 8px 24px rgba(0,0,0,.2); z-index:9; white-space:nowrap; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pick.on .ico { background:rgba(26,20,8,.1); color:var(--pri-ink); } }
  :root[data-theme="dark"] .pick.on .ico { background:rgba(26,20,8,.1); color:var(--pri-ink); }
  #toast.show { opacity:1; transform:translate(-50%, 0); }
</style>
</head>
<body>
<header id="hd"><div class="hd-in">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M16 3.5 6 7.2v7.6c0 6.4 4.2 10.8 10 13.2 5.8-2.4 10-6.8 10-13.2V7.2z"/><path d="M11.5 13h9M11.5 16.8h9M11.5 20.6h5.5"/>
    </svg>
    <div><h1>保險表格查詢</h1><div class="tagline" id="tagline">官方表格・每日自動更新</div></div>
  </div>
  <label class="search">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
    <input id="q" type="search" placeholder="搜尋表格，例如：轉數快、退保、受益人" autocomplete="off" aria-label="搜尋表格">
  </label>
  <div class="tabs">
    <button class="tab on" data-view="svc"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>依服務查找</button>
    <button class="tab" data-view="all"><svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="18" r=".8"/></svg>全部表格</button>
  </div>
  <button class="theme" id="theme" type="button"></button>
</div></header>
<div class="bar" id="bar" hidden></div>
<main>
  <div id="warn"></div>
  <div id="svc"></div>
  <div class="meta" id="meta">載入中…</div>
  <div id="list"></div>
  <div class="checked" id="checked" hidden></div>
</main>
<div id="toast" role="status"></div>
<script>
const RECENT_DAYS = 30;
let DATA = { forms: [], sources: [] }, company = "全部", recentOnly = false;
let SVC = { services: [], map: {} }, view = "svc", svcCo = null, svcName = null;
const NO_FORM = "官網未提供表格，請聯絡保險公司或經網上平台辦理";
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ===== 圖示 =====
const svg = d => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const IC = {
  send: svg('<path d="M21 3 3 10.4l7.2 2.4L12.6 20z"/><path d="m10.2 12.8 4.6-4.6"/>'),
  star: svg('<path d="m12 3.6 2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/>'),
  doc: svg('<path d="M14 3.5H7.5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8z"/><path d="M14 3.5V8h4.5"/>'),
  info: svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/>'),
  phone: svg('<path d="M5 4.5h3.5l1.6 4-2.1 1.3a11 11 0 0 0 6.2 6.2l1.3-2.1 4 1.6V19a1.5 1.5 0 0 1-1.6 1.5A15.5 15.5 0 0 1 3.5 6.1 1.5 1.5 0 0 1 5 4.5z"/>'),
  building: svg('<path d="M4 20.5h16M6 20.5V6.5l6-3 6 3v14"/><path d="M9.5 9.5h1M13.5 9.5h1M9.5 13h1M13.5 13h1M11 20.5v-3.5h2v3.5"/>'),
  arrow: svg('<path d="M5 12h14m-5-5 5 5-5 5"/>'),
  warn: svg('<path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17.2h.01"/>'),
};
const SVC_IC = {
  "全額退保": '<path d="M14 3.5H7.5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8z"/><path d="M14 3.5V8h4.5"/><path d="m9.8 12.3 4.4 4.4m0-4.4-4.4 4.4"/>',
  "部分提領": '<rect x="3" y="6" width="18" height="13" rx="2.2"/><path d="M3 10h18"/><path d="M12 12.5v4.3m-2.1-2 2.1 2 2.1-2"/>',
  "變更受益人": '<circle cx="9" cy="8.2" r="3.1"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M15.8 5.3a3 3 0 0 1 0 5.8M17.6 14.3A5.5 5.5 0 0 1 20.5 19"/>',
  "變更聯絡資料": '<rect x="3" y="5" width="18" height="14" rx="2.2"/><circle cx="9" cy="10.8" r="2.1"/><path d="M5.9 15.8a3.3 3.3 0 0 1 6.2 0M14.5 10h3.5M14.5 13.5h3.5"/>',
  "保費繳付": '<rect x="3" y="5.5" width="18" height="13" rx="2.2"/><path d="M3 10h18M7 14.8h3.5"/>',
  "保單貸款": '<path d="M3.5 9.3 12 4.3l8.5 5"/><path d="M5.5 10v7M9.8 10v7M14.2 10v7M18.5 10v7M3.5 20h17"/>',
  "更改保單持有人": '<circle cx="8" cy="8" r="3"/><path d="M3 18.5a5 5 0 0 1 10 0"/><path d="M15 8h6m-2-2 2 2-2 2M21 15h-6m2-2-2 2 2 2"/>',
  "保單復效": '<path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/><path d="M12 8.5v3.8l2.6 1.6"/>',
};
const svcIcon = n => svg(SVC_IC[n] || '<circle cx="12" cy="12" r="7"/>');

function isRecent(f) {
  if (!f.last_changed || f.last_changed === DATA.baseline_date) return false;
  // 新加入的公司：加入當天收錄的表格不算「新版」
  if (f.last_changed === (DATA.company_baseline || {})[f.company]) return false;
  return (Date.now() - new Date(f.last_changed)) / 864e5 <= RECENT_DAYS;
}

// 中文關鍵字對應英文表格名稱（官網多為英文標題）
const SYN = {
  "轉數快": ["fps", "faster payment"], "退保": ["surrender", "cancel"], "受益人": ["beneficiar"],
  "理賠": ["claim"], "索償": ["claim"], "賠償": ["claim"], "貸款": ["loan"], "保單貸款": ["policy loan"],
  "地址": ["address", "contact", "personal particular", "personal detail"], "聯絡": ["contact"],
  "自動轉賬": ["autopay", "direct debit", "ebankin", "e-bankin"], "直接付款": ["direct debit"],
  "提取": ["withdrawal"], "轉讓": ["ownership", "assignment", "transfer"], "持有人": ["owner", "policyholder"],
  "稅務": ["tax", "self-cert", "crs", "fatca"], "身故": ["death"], "危疾": ["critical illness", "major illness"],
  "住院": ["hospital"], "意外": ["accident"], "門診": ["outpatient"], "醫療": ["medical"],
  "復效": ["reinstat"], "付款": ["payment"], "繳費": ["premium", "payment"], "保費": ["premium"],
  "更改": ["change", "amend", "alteration"], "補發": ["duplicate", "reprint", "replacement"],
  "簽名": ["signature"], "投資": ["investment", "fund", "switch"], "授權": ["authori"], "年金": ["annuity"]
};
// 各家官網用字不同（帳／賬、匯／滙…），搜尋時視為同一個字
const VAR = { "賬":"帳", "滙":"匯", "証":"證", "裏":"裡", "户":"戶", "綫":"線", "衞":"衛", "啓":"啟", "羣":"群", "麪":"麵", "峯":"峰", "着":"著", "爲":"為", "僞":"偽", "污":"汙", "竪":"豎", "缐":"線", "鈎":"鉤", "台":"臺" };
const norm = s => String(s).toLowerCase().replace(/[賬滙証裏户綫衞啓羣麪峯着爲僞污竪缐鈎台]/g, c => VAR[c]);
const termsFor = w => [w, ...Object.entries(SYN).filter(([k]) => norm(k).includes(w) || w.includes(norm(k))).flatMap(([, v]) => v)];

function renderBar() {
  const names = [...new Set(DATA.forms.map(f => f.company_name))];
  const nRecent = DATA.forms.filter(isRecent).length;
  $("bar").innerHTML =
    `<button class="chip recent ${recentOnly ? "on" : ""}" data-recent>近期更新${nRecent ? " " + nRecent : ""}</button>` +
    ["全部", ...names].map(n => `<button class="chip ${n === company ? "on" : ""}" data-co="${esc(n)}">${esc(n)}</button>`).join("");
}

// 常用表格（只存在這支手機／這台電腦）
let FAVS = (() => { try { return JSON.parse(store.get("favs") || "[]"); } catch (e) { return []; } })();
const isFav = id => FAVS.includes(id);
function toggleFav(id) {
  FAVS = isFav(id) ? FAVS.filter(x => x !== id) : [id, ...FAVS];
  store.set("favs", JSON.stringify(FAVS));
  toast(isFav(id) ? "已加入常用" : "已從常用移除");
}

function card(f, pre = "", extra = "", flag = "") {
  const on = isFav(f.id), lab = on ? "從常用移除" : "加入常用";
  return `<div class="card"><div class="doc">${IC.doc}</div><div class="txt">
      <div class="title">${flag}${isRecent(f) ? '<span class="badge">新版</span>' : ""}${esc(f.title)}</div>
      ${extra}
      <div class="sub">${pre}<span>更新於 ${esc(f.last_changed)}</span></div>
    </div><div class="btns">
      <a class="btn primary" href="${esc(f.url)}" target="_blank" rel="noopener">開啟</a>
      <div class="acts">
        <button class="btn" data-share="${esc(f.id)}" title="分享到 Telegram" aria-label="分享到 Telegram">${IC.send}分享</button>
        <button class="btn fav ${on ? "on" : ""}" data-fav="${esc(f.id)}" title="${lab}" aria-label="${lab}">${IC.star}</button>
      </div>
    </div></div>`;
}

function favBlock(onlyCo) {
  const byId = Object.fromEntries(DATA.forms.map(f => [f.id, f]));
  const rows = FAVS.map(id => byId[id]).filter(f => f && (!onlyCo || f.company_name === onlyCo));
  if (!rows.length) return "";
  return `<div class="step fav-h"><span class="num">★</span>我的常用</div>` + rows.map(f => card(f, `<span class="co">${esc(f.company_name)}</span>`)).join("");
}

// 公司名稱拆成中文／英文兩行，例如「友邦 AIA」
const splitName = n => { const m = String(n).match(/^(.*?)\s+([A-Za-z].*)$/); return m ? [m[1], m[2]] : [n, ""]; };
// 換標誌時把這個數字加 1，大家的手機就會重新下載
const LOGO_V = 2;
const hueOf = s => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);

// 依服務查找：選公司 → 選服務 → 顯示表格
function renderSvc() {
  const byId = Object.fromEntries(DATA.forms.map(f => [f.id, f]));
  const coName = c => ((DATA.sources || []).find(s => s.company === c) || {}).name || c;
  const cos = Object.keys(SVC.map);
  let html = `<div class="svc-wrap"><div class="svc-left"><div class="step"><span class="num">1</span>選擇保險公司</div><div class="grid">` +
    cos.map(c => {
      const [zh, en] = splitName(coName(c)), n = DATA.forms.filter(f => f.company === c).length;
      return `<button class="pick ${c === svcCo ? "on" : ""}" data-svcco="${esc(c)}"><span class="mono" style="--h:${hueOf(c)}">${esc([...zh][0] || "")}<img src="logos/${esc(c)}.png?v=${LOGO_V}" alt="" onerror="this.remove()"></span>` +
        `<span class="nm"><b>${esc(zh)}</b><small>${esc([en, n ? n + " 份" : ""].filter(Boolean).join("・"))}</small></span></button>`;
    }).join("") + `</div>`;
  if (svcCo) {
    html += `<div class="step"><span class="num">2</span>選擇服務</div><div class="grid">` +
      SVC.services.map(n => `<button class="pick svc ${n === svcName ? "on" : ""}" data-svc="${esc(n)}"><span class="ico">${svcIcon(n)}</span><span>${esc(n)}</span></button>`).join("") + `</div>`;
  }
  html += `</div><div class="svc-right">`;
  if (!(svcCo && svcName)) {
    const fb = favBlock();
    html += fb || `<div class="ph"><div class="ph-steps">
        <div><span class="ico">${IC.building}</span>選公司</div><span class="ph-arrow">${IC.arrow}</span>
        <div><span class="ico">${svcIcon("變更聯絡資料")}</span>選服務</div><span class="ph-arrow">${IC.arrow}</span>
        <div><span class="ico">${IC.doc}</span>取得表格</div></div>
        <p>請在左邊選擇保險公司和服務，<br>需要的表格會顯示在這裡</p></div>`;
  }
  if (svcCo && svcName) {
    const items = ((SVC.map[svcCo] || {})[svcName] || []).filter(([id]) => byId[id]);
    html += `<div class="step res-h"><span class="res-t"><span class="num">3</span><span>${esc(coName(svcCo))}・${esc(svcName)}</span></span>` +
      (items.length ? `<button class="btn gold" data-shareall>${IC.send}分享全部・${items.length} 份</button>` : "") + `</div>`;
    if (!items.length) html += `<div class="none">${IC.phone}${NO_FORM}</div>`;
    for (const [id, st, note] of items) {
      const f = byId[id];
      const flag = st === "check" ? '<span class="chk">待確認</span>' : "";
      const tip = [note, st === "check" ? "是否需要此表格，請向保險公司確認" : ""].filter(Boolean).join("；");
      html += card(f, "", tip ? `<div class="note">${esc(tip)}</div>` : "", flag);
    }
    if (items.length) html += `<div class="hint">${IC.info}<span>標示「待確認」的表格不一定需要，提交前請向保險公司或官網確認。表格以官網最新版本為準。</span></div>`;
  }
  $("svc").innerHTML = html + `</div></div>`;
}

function setView(v) {
  view = v;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.view === v));
  $("bar").hidden = v !== "all";
  $("svc").hidden = v !== "svc";
  $("meta").hidden = $("list").hidden = v !== "all";
  fixBar();
  if (v === "svc") renderSvc(); else { renderBar(); render(); }
}

function render() {
  const words = norm($("q").value.trim()).split(/\s+/).filter(Boolean);
  let rows = DATA.forms.filter(f =>
    (company === "全部" || f.company_name === company) &&
    (!recentOnly || isRecent(f)) &&
    words.every(w => {
      const hay = norm(f.title + " " + f.category + " " + f.filename + " " + f.company_name);
      return termsFor(w).some(t => hay.includes(t));
    }));
  if (recentOnly) rows.sort((a, b) => b.last_changed.localeCompare(a.last_changed));

  let html = (!words.length && !recentOnly) ? favBlock(company === "全部" ? "" : company) : "", last = "";
  if (html) html = `<div class="favs">${html}</div>`;
  for (const f of rows) {
    const g = recentOnly ? "" : f.company_name + "｜" + f.category;
    if (g && g !== last) { html += `<div class="group"><b>${esc(f.company_name)}</b><span>${esc(f.category)}</span></div>`; last = g; }
    html += card(f, recentOnly ? `<span class="co">${esc(f.company_name)}</span>` : "");
  }
  $("list").innerHTML = html || `<div class="empty">找不到符合的表格</div>`;
  $("meta").textContent = `共 ${rows.length} 份・最後檢查：${DATA.generated_at || "—"}`;
}

// 分享：附上公司和表格名稱，方便直接貼給客戶
// 直接開 Telegram 選聊天對象；同時把內容複製起來，萬一 Telegram 沒開成也能自己貼上
async function shareText(title, text) {
  try { await navigator.clipboard.writeText(text); } catch (e) {}
  window.open("https://t.me/share/url?url=" + encodeURIComponent(text), "_blank", "noopener");
  toast("正在開啟 Telegram（內容也已複製）");
}
function shareOne(id) {
  const f = DATA.forms.find(x => x.id === id); if (!f) return;
  shareText(f.title, `${f.company_name}｜${f.title}\n${f.url}`);
}
function shareAll() {
  const byId = Object.fromEntries(DATA.forms.map(f => [f.id, f]));
  const coName = ((DATA.sources || []).find(s => s.company === svcCo) || {}).name || svcCo;
  const items = ((SVC.map[svcCo] || {})[svcName] || []).filter(([id]) => byId[id]);
  const lines = items.map(([id, st], i) => `${i + 1}. ${byId[id].title}${st === "check" ? "（如適用）" : ""}\n${byId[id].url}`);
  shareText(`${coName} ${svcName}`, `${coName}・${svcName} 需要的表格：\n\n${lines.join("\n\n")}`);
}
let toastT;
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1800); }

document.addEventListener("click", e => {
  const c = e.target.closest("[data-co]"), r = e.target.closest("[data-recent]"), s = e.target.closest("[data-share]");
  if (c) { company = c.dataset.co; renderBar(); render(); }
  if (r) { recentOnly = !recentOnly; renderBar(); render(); }
  if (s) shareOne(s.dataset.share);
  if (e.target.closest("[data-shareall]")) shareAll();
  const fv = e.target.closest("[data-fav]");
  if (fv) { toggleFav(fv.dataset.fav); if (view === "svc") renderSvc(); else render(); }
  const t = e.target.closest("[data-view]"), sc = e.target.closest("[data-svcco]"), sv = e.target.closest("[data-svc]");
  if (t) setView(t.dataset.view);
  if (sc) { svcCo = sc.dataset.svcco; store.set("svcCo", svcCo); renderSvc(); }
  if (sv) {
    svcName = sv.dataset.svc; store.set("svcName", svcName); renderSvc();
    const step = [...document.querySelectorAll(".step")].pop();
    if (step && innerWidth < 900) step.scrollIntoView({ behavior: "smooth", block: "start" });
  }
});
$("q").addEventListener("input", () => { if (view !== "all" && $("q").value.trim()) setView("all"); else render(); });
const fixBar = () => document.documentElement.style.setProperty("--hh", $("hd").offsetHeight + "px");
addEventListener("resize", fixBar); fixBar();
// 手機往下滑時收起標題，讓表格多露出一點
addEventListener("scroll", () => {
  const hd = $("hd"), y = scrollY;
  if (y > 60 && !hd.classList.contains("mini")) { hd.classList.add("mini"); fixBar(); }
  else if (y < 8 && hd.classList.contains("mini")) { hd.classList.remove("mini"); fixBar(); }
}, { passive: true });

Promise.all([
  fetch("forms.json", { cache: "no-store" }).then(r => r.json()),
  fetch("services.json", { cache: "no-store" }).then(r => r.json()).catch(() => ({ services: [], map: {} }))
]).then(([d, sv]) => {
  DATA = d; SVC = sv;
  svcCo = SVC.map[store.get("svcCo")] ? store.get("svcCo") : null;
  svcName = svcCo && SVC.services.includes(store.get("svcName")) ? store.get("svcName") : null;
  const bad = (d.sources || []).filter(s => !s.ok);
  if (bad.length) $("warn").innerHTML = `<div class="warn">${IC.warn}<span>${bad.map(s => esc(s.name)).join("、")} 最近一次更新失敗，顯示的可能不是最新版本，請以官網為準。</span></div>`;
  showChecked(d.generated_at);
  setView(Object.keys(SVC.map).length ? "svc" : "all");
}).catch(() => { $("meta").textContent = "載入失敗，請檢查網路後重新整理"; });

// 上次檢查官網的時間（每天自動檢查一次；就算表格沒變，時間也會更新）
function showChecked(at) {
  if (!at) return;
  const t = new Date(at.replace(" ", "T") + ":00+08:00");
  if (isNaN(t)) return;
  const day = x => x.toLocaleDateString("en-CA", { timeZone: "Asia/Hong_Kong" });
  const now = new Date(), y = new Date(now - 864e5);
  const hm = at.slice(11, 16), [Y, M, D] = at.slice(0, 10).split("-").map(Number);
  const when = day(t) === day(now) ? "今天" : day(t) === day(y) ? "昨天" : `${M}月${D}日`;
  const old = now - t > 36 * 3600e3;   // 超過一天半沒檢查，多半是自動更新出了問題
  $("tagline").innerHTML = `<span class="dot${old ? " old" : ""}"></span>上次檢查：${when} ${hm}`;
  $("checked").hidden = false;
  $("checked").innerHTML = `上次檢查官網：<b>${Y}年${M}月${D}日 ${hm}</b>（${when}）<br>`
    + (old ? `<span class="old">已超過一天沒有檢查，表格可能不是最新，請以官網為準</span>`
           : `每天自動檢查一次，有新表格或改版會自動更新`);
}

// 深色／淺色模式開關（記在這支手機／這台電腦）
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => (document.documentElement.dataset.theme || (darkMQ.matches ? "dark" : "light")) === "dark";
function paintTheme() {
  const d = isDark(), b = $("theme");
  b.innerHTML = d ? svg('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>')
                  : svg('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>');
  b.title = b.ariaLabel = d ? "切換到淺色模式" : "切換到深色模式";
}
$("theme").addEventListener("click", () => {
  const t = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = t; store.set("theme", t); paintTheme();
  toast(t === "dark" ? "已切換到深色模式" : "已切換到淺色模式");
});
darkMQ.addEventListener?.("change", paintTheme);
paintTheme();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>

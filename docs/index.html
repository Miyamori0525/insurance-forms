<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="表格查詢">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>保險表格查詢</title>
<style>
  :root { --ink:#1b2430; --muted:#6b7280; --line:#e4e0d6; --bg:#f6f4ef; --card:#fff; --navy:#1f3a5f; --new:#c2410c; --warn:#b45309; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; z-index:5; background:var(--navy); color:#fff; padding:calc(env(safe-area-inset-top) + 14px) 16px 12px; }
  h1 { margin:0 0 10px; font-size:19px; letter-spacing:.5px; }
  #q { width:100%; font-size:16px; padding:11px 14px; border:0; border-radius:10px; outline:none; }
  .bar { display:flex; gap:8px; overflow-x:auto; padding:10px 16px; background:var(--bg); border-bottom:1px solid var(--line); position:sticky; top:var(--hh,108px); z-index:4; scrollbar-width:none; }
  .chip { flex:0 0 auto; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:7px 13px; font-size:14px; cursor:pointer; }
  .chip.on { background:var(--navy); border-color:var(--navy); color:#fff; }
  .chip.recent.on { background:var(--new); border-color:var(--new); }
  main { max-width:760px; margin:0 auto; padding:10px 12px 40px; }
  .meta { color:var(--muted); font-size:13px; margin:6px 4px 10px; }
  .warn { background:#fff7ed; border:1px solid #fed7aa; color:var(--warn); border-radius:10px; padding:10px 12px; font-size:14px; margin-bottom:10px; }
  .group { font-size:13px; color:var(--muted); margin:18px 4px 6px; font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; display:flex; gap:12px; align-items:center; }
  .card .txt { flex:1; min-width:0; }
  .title { font-size:15.5px; line-height:1.35; word-break:break-word; }
  .sub { font-size:12.5px; color:var(--muted); margin-top:4px; overflow-wrap:anywhere; }
  .badge { display:inline-block; font-size:11px; font-weight:700; color:#fff; background:var(--new); border-radius:5px; padding:1px 6px; margin-right:5px; vertical-align:2px; }
  .co { display:inline-block; font-size:11px; color:var(--navy); border:1px solid #c7d2e0; border-radius:5px; padding:0 5px; margin-right:6px; }
  .btns { display:flex; flex-direction:column; gap:6px; }
  .btn { font-size:14px; text-decoration:none; text-align:center; border-radius:8px; padding:8px 12px; border:1px solid var(--navy); color:var(--navy); background:#fff; cursor:pointer; white-space:nowrap; }
  .btn.primary { background:var(--navy); color:#fff; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  .tabs { display:flex; gap:6px; margin-top:10px; }
  .tab { flex:1; border:0; border-radius:9px; padding:9px 0; font-size:15px; background:rgba(255,255,255,.14); color:#fff; cursor:pointer; }
  .tab.on { background:#fff; color:var(--navy); font-weight:700; }
  .step { font-size:14px; font-weight:700; color:var(--navy); margin:16px 4px 8px; scroll-margin-top:calc(var(--hh,150px) + 8px); }
  .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; }
  .pick { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:10px; padding:12px 8px; font-size:15px; cursor:pointer; text-align:center; }
  .pick.on { background:var(--navy); border-color:var(--navy); color:#fff; font-weight:700; }
  .pick small { display:block; font-size:11.5px; color:var(--muted); margin-top:2px; }
  .pick.on small { color:#dbe4f0; }
  .note { font-size:12.5px; color:#475569; margin-top:5px; }
  .chk { display:inline-block; font-size:11px; font-weight:700; color:var(--warn); background:#fff7ed; border:1px solid #fed7aa; border-radius:5px; padding:0 5px; margin-right:5px; vertical-align:1px; }
  .none { background:#fff; border:1px dashed #cbd5e1; border-radius:12px; padding:18px 14px; color:#475569; font-size:14.5px; line-height:1.6; text-align:center; }
  .hint { font-size:12.5px; color:var(--muted); margin:10px 4px 0; line-height:1.5; }
  .ph { display:none; }
  .pick:hover, .chip:hover { border-color:#9fb3cc; }
  .btn:hover { filter:brightness(1.08); }
  /* ===== 電腦版（螢幕寬度 900px 以上） ===== */
  @media (min-width: 900px) {
    header { padding:14px max(24px, calc((100vw - 1140px) / 2)); }
    .hd-in { display:grid; grid-template-columns:auto 1fr 320px; gap:20px; align-items:center; }
    h1 { margin:0; font-size:21px; }
    .tabs { margin-top:0; }
    .bar { padding:10px max(24px, calc((100vw - 1140px) / 2)); flex-wrap:wrap; }
    main { max-width:1140px; padding:16px 24px 60px; }
    .svc-wrap { display:grid; grid-template-columns:360px 1fr; gap:32px; align-items:start; }
    .svc-left { position:sticky; top:calc(var(--hh,80px) + 8px); }
    .svc-right .step:first-child { margin-top:16px; }
    .ph { display:block; margin-top:52px; background:#fff; border:1px dashed #cbd5e1; border-radius:14px; padding:48px 20px; text-align:center; color:var(--muted); font-size:15px; line-height:1.8; }
    .ph b { display:block; font-size:28px; color:#cbd5e1; margin-bottom:6px; }
    #list { display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:stretch; }
    #list .group, #list .empty { grid-column:1 / -1; }
    #list > *, .svc-wrap > * { min-width:0; }
    .btns { flex-direction:row; }
    #list .group { margin:14px 4px 0; }
    .card { margin-bottom:0; }
    .svc-right .card { margin-bottom:10px; }
    .card:hover { border-color:#c7d2e0; box-shadow:0 2px 10px rgba(31,58,95,.07); }
  }
  #toast { position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background:#111; color:#fff; padding:9px 16px; border-radius:8px; font-size:14px; opacity:0; transition:.2s; pointer-events:none; }
</style>
</head>
<body>
<header id="hd"><div class="hd-in">
  <h1>保險表格查詢</h1>
  <input id="q" type="search" placeholder="搜尋表格，例如：轉數快、退保、受益人" autocomplete="off">
  <div class="tabs">
    <button class="tab on" data-view="svc">依服務查找</button>
    <button class="tab" data-view="all">全部表格</button>
  </div>
</div></header>
<div class="bar" id="bar" hidden></div>
<main>
  <div id="warn"></div>
  <div id="svc"></div>
  <div class="meta" id="meta">載入中…</div>
  <div id="list"></div>
</main>
<div id="toast"></div>
<script>
const RECENT_DAYS = 30;
let DATA = { forms: [], sources: [] }, company = "全部", recentOnly = false;
let SVC = { services: [], map: {} }, view = "svc", svcCo = null, svcName = null;
const NO_FORM = "官網未提供表格，請聯絡保險公司或經網上平台辦理";
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function isRecent(f) {
  if (!f.last_changed || f.last_changed === DATA.baseline_date) return false;
  // 新加入的公司：加入當天收錄的表格不算「新版」
  if (f.last_changed === (DATA.company_baseline || {})[f.company]) return false;
  return (Date.now() - new Date(f.last_changed)) / 864e5 <= RECENT_DAYS;
}

// 中文關鍵字對應英文表格名稱（官網多為英文標題）
const SYN = {
  "轉數快": ["fps", "faster payment"], "退保": ["surrender", "cancel"], "受益人": ["beneficiar"],
  "理賠": ["claim"], "索償": ["claim"], "賠償": ["claim"], "貸款": ["loan"], "保單貸款": ["policy loan"],
  "地址": ["address", "contact", "personal particular", "personal detail"], "聯絡": ["contact"],
  "自動轉賬": ["autopay", "direct debit", "ebankin", "e-bankin"], "直接付款": ["direct debit"],
  "提取": ["withdrawal"], "轉讓": ["ownership", "assignment", "transfer"], "持有人": ["owner", "policyholder"],
  "稅務": ["tax", "self-cert", "crs", "fatca"], "身故": ["death"], "危疾": ["critical illness", "major illness"],
  "住院": ["hospital"], "意外": ["accident"], "門診": ["outpatient"], "醫療": ["medical"],
  "復效": ["reinstat"], "付款": ["payment"], "繳費": ["premium", "payment"], "保費": ["premium"],
  "更改": ["change", "amend", "alteration"], "補發": ["duplicate", "reprint", "replacement"],
  "簽名": ["signature"], "投資": ["investment", "fund", "switch"], "授權": ["authori"], "年金": ["annuity"]
};
const termsFor = w => [w, ...Object.entries(SYN).filter(([k]) => k.includes(w) || w.includes(k)).flatMap(([, v]) => v)];

function renderBar() {
  const names = [...new Set(DATA.forms.map(f => f.company_name))];
  const nRecent = DATA.forms.filter(isRecent).length;
  $("bar").innerHTML =
    `<button class="chip recent ${recentOnly ? "on" : ""}" data-recent>近期更新${nRecent ? " " + nRecent : ""}</button>` +
    ["全部", ...names].map(n => `<button class="chip ${n === company ? "on" : ""}" data-co="${esc(n)}">${esc(n)}</button>`).join("");
}

function card(f, pre = "", extra = "", flag = "") {
  return `<div class="card"><div class="txt">
      <div class="title">${flag}${isRecent(f) ? '<span class="badge">新版</span>' : ""}${esc(f.title)}</div>
      ${extra}
      <div class="sub">${pre}${esc(f.filename)}・更新於 ${esc(f.last_changed)}</div>
    </div><div class="btns">
      <a class="btn primary" href="${esc(f.url)}" target="_blank" rel="noopener">開啟</a>
      <button class="btn" data-share="${esc(f.url)}" data-title="${esc(f.title)}">分享</button>
    </div></div>`;
}

// 依服務查找：選公司 → 選服務 → 顯示表格
function renderSvc() {
  const byId = Object.fromEntries(DATA.forms.map(f => [f.id, f]));
  const coName = c => ((DATA.sources || []).find(s => s.company === c) || {}).name || c;
  const cos = Object.keys(SVC.map);
  let html = `<div class="svc-wrap"><div class="svc-left"><div class="step">① 選擇保險公司</div><div class="grid">` +
    cos.map(c => `<button class="pick ${c === svcCo ? "on" : ""}" data-svcco="${esc(c)}">${esc(coName(c))}</button>`).join("") + `</div>`;
  if (svcCo) {
    html += `<div class="step">② 選擇服務</div><div class="grid">` +
      SVC.services.map(n => `<button class="pick ${n === svcName ? "on" : ""}" data-svc="${esc(n)}">${esc(n)}</button>`).join("") + `</div>`;
  }
  html += `</div><div class="svc-right">`;
  if (!(svcCo && svcName)) html += `<div class="ph"><b>←</b>請在左邊選擇保險公司和服務，<br>需要的表格會顯示在這裡</div>`;
  if (svcCo && svcName) {
    const items = ((SVC.map[svcCo] || {})[svcName] || []).filter(([id]) => byId[id]);
    html += `<div class="step">③ ${esc(coName(svcCo))}・${esc(svcName)} 需要的表格</div>`;
    if (!items.length) html += `<div class="none">${NO_FORM}</div>`;
    for (const [id, st, note] of items) {
      const f = byId[id];
      const flag = st === "check" ? '<span class="chk">待確認</span>' : "";
      const tip = [note, st === "check" ? "是否需要此表格，請向保險公司確認" : ""].filter(Boolean).join("；");
      html += card(f, "", tip ? `<div class="note">${esc(tip)}</div>` : "", flag);
    }
    if (items.length) html += `<div class="hint">標示「待確認」的表格不一定需要，提交前請向保險公司或官網確認。表格以官網最新版本為準。</div>`;
  }
  $("svc").innerHTML = html + `</div></div>`;
}

function setView(v) {
  view = v;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.view === v));
  $("bar").hidden = v !== "all";
  $("svc").hidden = v !== "svc";
  $("meta").hidden = $("list").hidden = v !== "all";
  fixBar();
  if (v === "svc") renderSvc(); else { renderBar(); render(); }
}

function render() {
  const words = $("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let rows = DATA.forms.filter(f =>
    (company === "全部" || f.company_name === company) &&
    (!recentOnly || isRecent(f)) &&
    words.every(w => {
      const hay = (f.title + " " + f.category + " " + f.filename + " " + f.company_name).toLowerCase();
      return termsFor(w).some(t => hay.includes(t));
    }));
  if (recentOnly) rows.sort((a, b) => b.last_changed.localeCompare(a.last_changed));

  let html = "", last = "";
  for (const f of rows) {
    const g = recentOnly ? "" : f.company_name + "｜" + f.category;
    if (g && g !== last) { html += `<div class="group">${esc(g)}</div>`; last = g; }
    html += card(f, recentOnly ? `<span class="co">${esc(f.company_name)}</span>` : "");
  }
  $("list").innerHTML = html || `<div class="empty">找不到符合的表格</div>`;
  $("meta").textContent = `共 ${rows.length} 份・最後檢查：${DATA.generated_at || "—"}`;
}

async function share(url, title) {
  if (navigator.share) { try { await navigator.share({ title, url }); } catch (e) {} return; }
  try { await navigator.clipboard.writeText(url); toast("已複製連結"); } catch (e) { prompt("複製這個連結：", url); }
}
function toast(t) { $("toast").textContent = t; $("toast").style.opacity = 1; setTimeout(() => $("toast").style.opacity = 0, 1600); }

document.addEventListener("click", e => {
  const c = e.target.closest("[data-co]"), r = e.target.closest("[data-recent]"), s = e.target.closest("[data-share]");
  if (c) { company = c.dataset.co; renderBar(); render(); }
  if (r) { recentOnly = !recentOnly; renderBar(); render(); }
  if (s) share(s.dataset.share, s.dataset.title);
  const t = e.target.closest("[data-view]"), sc = e.target.closest("[data-svcco]"), sv = e.target.closest("[data-svc]");
  if (t) setView(t.dataset.view);
  if (sc) { svcCo = sc.dataset.svcco; store.set("svcCo", svcCo); renderSvc(); }
  if (sv) {
    svcName = sv.dataset.svc; store.set("svcName", svcName); renderSvc();
    const step = [...document.querySelectorAll(".step")].pop();
    if (step && innerWidth < 900) step.scrollIntoView({ behavior: "smooth", block: "start" });
  }
});
$("q").addEventListener("input", () => { if (view !== "all" && $("q").value.trim()) setView("all"); else render(); });
const fixBar = () => document.documentElement.style.setProperty("--hh", $("hd").offsetHeight + "px");
addEventListener("resize", fixBar); fixBar();

Promise.all([
  fetch("forms.json", { cache: "no-store" }).then(r => r.json()),
  fetch("services.json", { cache: "no-store" }).then(r => r.json()).catch(() => ({ services: [], map: {} }))
]).then(([d, sv]) => {
  DATA = d; SVC = sv;
  svcCo = SVC.map[store.get("svcCo")] ? store.get("svcCo") : null;
  svcName = svcCo && SVC.services.includes(store.get("svcName")) ? store.get("svcName") : null;
  const bad = (d.sources || []).filter(s => !s.ok);
  if (bad.length) $("warn").innerHTML = `<div class="warn">⚠️ ${bad.map(s => esc(s.name)).join("、")} 最近一次更新失敗，顯示的可能不是最新版本，請以官網為準。</div>`;
  setView(Object.keys(SVC.map).length ? "svc" : "all");
}).catch(() => { $("meta").textContent = "載入失敗，請檢查網路後重新整理"; });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
